<aside id="sidebar" class="sidebar" [class.active]="isSidebarOpen">
    <ul class="sidebar-nav" id="sidebar-nav">
        <li class="nav-item">
            <a class="nav-link collapsed" routerLink="/dashboard" routerLinkActive="active">
                <i class="fas fa-tachometer-alt"></i>
                <span>Dashboard</span>
            </a>
        </li><!-- End Dashboard Nav -->

        <li class="nav-item">
            <a class="nav-link collapsed" routerLink="/escalation" routerLinkActive="active">
                <i class="fas fa-user-shield"></i>
                
                <span>Escalation Matrix</span>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link d-flex justify-content-between align-items-center" (click)="toggleReports()"
                [class.active]="isReportsOpen" style="cursor: pointer;">
                <div>
                    <i class="fas fa-chart-bar"></i>
                    <span>Reports</span>
                </div>
                <i class="fas" [ngClass]="{'fa-chevron-down': isReportsOpen, 'fa-chevron-right': !isReportsOpen}"></i>
            </a>
            <ul *ngIf="isReportsOpen" class="nav flex-column ms-3">
                <li class="nav-item">
                    <a class="nav-link" routerLink="/sitemaster" routerLinkActive="active">Site Master</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" routerLink="/healthstatus" routerLinkActive="active">Health Status</a>
                </li>
            </ul>
        </li>
        <!-- User Management - Only for Admin -->
        <li class="nav-item" *ngIf="isAdmin()">
            <a class="nav-link collapsed" routerLink="/usermanagement" routerLinkActive="active">
                <i class="fa fa-users"></i>
                <span>User Management</span>
            </a>
        </li>
        <!-- Live Health - Only for Admin -->
        <li class="nav-item" *ngIf="isAdmin()">
            <a class="nav-link collapsed" routerLink="/live-health" routerLinkActive="active">
                <i class="fas fa-heartbeat"></i>
                <span>Live Health</span>
            </a>
        </li>
        <!-- End Dashboard Nav -->

        <!-- User Management - Only show if userRole !== 'User' -->
        <!-- <li class="nav-item" *ngIf="userRole !== 'User'">
            <a class="nav-link collapsed" routerLink="/usermanagement" routerLinkActive="active">
                <i class="fa fa-users"></i>
                <span>User Management</span>
            </a>
        </li> -->
        <!-- End User Management Nav -->
    </ul>
</aside>
