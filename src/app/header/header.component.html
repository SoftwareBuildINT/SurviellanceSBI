<div class="header">
  <div class="logo">
    <img src="assets/images/Hitachi-removebg-preview.png" alt="Company Logo">
  </div>
  <div class="sidebar-toggle">
    <button class="toggle-button" (click)="toggleSidebar()">☰</button>
    <div class="page-heading">
      <h3>{{ heading }}</h3>
    </div>
  </div>



  <div class="user">
    <div class="logo sbi-logo-container">
      <img src="assets/images/sbi.png" alt="SBI Logo" class="sbi-logo">
    </div>
    <div class="user-name">
      {{ userEmail }}
    </div>
    <!-- <div class="user-image"></div> -->
    <div class="dropdown">
      <button class="dropdown-toggle" type="button" (click)="toggleDropdown()"
        [attr.aria-expanded]="isDropdownOpen" aria-label="Open account menu">
        <svg class="account-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9.25"></circle>
          <circle cx="12" cy="9" r="2.6"></circle>
          <path d="M6.8 18.6c.8-2.7 2.6-4.1 5.2-4.1s4.4 1.4 5.2 4.1"></path>
        </svg>
        <svg class="dropdown-caret" viewBox="0 0 12 8" aria-hidden="true">
          <path d="m1 1 5 5 5-5"></path>
        </svg>
      </button>

      <div class="dropdown-menu" [class.show]="isDropdownOpen" (click)="$event.stopPropagation()">

        <!-- Show expiry days if still valid -->
        <label class="dropdown-item" *ngIf="passwordStatus === 'valid'">
          Password expires in {{ passwordExpiryDays }} days
        </label>

        <!-- Show expired message if expired -->
        <label class="dropdown-item" *ngIf="passwordStatus === 'expired'">
          Password expired
        </label>

        <!-- Optional: while loading -->
        <label class="dropdown-item" *ngIf="passwordStatus === ''">
          Checking password expiry...
        </label>

        <button type="button" class="dropdown-item logout-item" (click)="selectItem('Logout')">
          <svg class="logout-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10 17l5-5-5-5M15 12H3"></path>
            <path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"></path>
          </svg>
          <span>Logout</span>
        </button>
      </div>
    </div>


  </div>
</div>
