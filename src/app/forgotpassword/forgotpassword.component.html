<div class="forgot-container">
  <!-- Left Side Image -->
  <div class="forgot-left">
    <img src="assets/images/hitachi logo.png" alt="Welcome Image" class="welcome-image" />
  </div>

  <!-- Right Side Form -->
  <div class="forgot-right">
    <div class="logo-container">
      <img src="assets/images/sbi.png" alt="SBI Logo" class="sbi-logo" />
    </div>

    <h2 class="form-title">Forgot Password</h2>

    <!-- Email Form -->
    <form #forgotForm="ngForm" (ngSubmit)="onSubmit(forgotForm)" class="forgot-form">
      <p>Enter your registered email to reset your password.</p>

      <div class="form-group">
        <label for="email">Email:</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          #emailModel="ngModel"
          required
          email
          placeholder="Enter your email"
          class="form-control"
        />
        <div *ngIf="emailError" class="error-message">{{ emailError }}</div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" [disabled]="forgotForm.invalid">
          Send OTP
        </button>
        <button type="button" class="btn btn-secondary" routerLink="/login">Cancel</button>
      </div>
    </form>

    <footer class="footer">
      Powered by <span class="build">Build</span><span class="int">INT</span>
    </footer>
  </div>
</div>

<!-- Popup -->
<div class="popup-overlay" *ngIf="showPopup">
  <div class="popup">
    <!-- Error Message -->
    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

    <!-- Success Message -->
    <div *ngIf="successMessage" class="success-message">
      {{ successMessage }}
    </div>

    <button (click)="closePopup()">OK</button>
  </div>
</div>
