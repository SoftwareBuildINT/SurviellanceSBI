<div class="otp-container" *ngIf="otpForm">
  <!-- Left Side Image -->
  <div class="otp-left">
    <img src="assets/images/hitachi logo.png" alt="Hitachi Logo" class="welcome-image" />
  </div>

  <!-- Right Side Form -->
  <div class="otp-right">
    <div class="logo-container">
      <img src="assets/images/sbi.png" alt="SBI Logo" class="sbi-logo" />
    </div>

    <!-- OTP Form -->
    <form (ngSubmit)="verifyOtp()" [formGroup]="otpForm" class="otp-form">
      <div class="form-group">
        <label class="form-label">Enter OTP sent to your registered Email:</label>

        <!-- OTP input boxes (guarded) -->
        <div class="otp-inputs" formArrayName="otp">
          <ng-container *ngIf="otpControls?.length as len">
            <input *ngFor="let ctrl of otpControls.controls; let i = index"
                   [formControlName]="i"
                   type="text"
                   maxlength="1"
                   (input)="onInput($event, i)"
                   (keydown)="onKeydown($event, i)"
                   class="otp-box" />
          </ng-container>
        </div>

        <!-- Error/Success messages -->
        <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
        <div *ngIf="successMessage" class="success-message">{{ successMessage }}</div>
      </div>

      <!-- Timer -->
      <div *ngIf="(timer ?? 0) > 0" class="otp-timer">
        OTP expires in: {{ formattedTimer }}
      </div>
      <div *ngIf="!( (timer ?? 0) > 0 )" class="otp-timer-expired">
        OTP has expired. Please request a new OTP.
      </div>

      <!-- Verify Button -->
      <button type="submit" class="btn btn-primary" [disabled]="!otpForm.valid || (timer ?? 0) <= 0">
        Verify OTP
      </button>
    </form>

    <footer class="footer">
      Powered by <span class="build">Build</span><span class="int">INT</span>
    </footer>
  </div>
</div>

<div *ngIf="showPopup" class="popup-overlay">
  <div class="popup">
    <p>
      <b>Contact Administrator</b><br />
      Your account is locked due to maximum OTP attempts.
    </p>
    <button (click)="closePopup()" class="btn btn-danger">Close</button>
  </div>
</div>
