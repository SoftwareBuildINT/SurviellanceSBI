<div class="changepassword-container">
  <!-- Left Side -->
  <div class="changepassword-left">
    <img src="assets/images/hitachi logo.png" alt="Hitachi Logo" class="welcome-image" />
  </div>

  <!-- Right Side -->
  <div class="changepassword-right">
    <div class="logo-container">
      <img src="assets/images/sbi.png" alt="SBI Logo" class="sbi-logo" />
    </div>

    <!-- Reset Password Form -->
    <form [formGroup]="resetPasswordForm" (ngSubmit)="resetPassword()" class="changepassword-form">

      

      <!-- New Password -->
      <div class="form-group password-group">
        <label class="form-label">New Password:</label>
        <div class="input-wrapper">
          <input 
            [type]="showNewPassword ? 'text' : 'password'" 
            formControlName="newPassword" 
            class="form-control" 
            (input)="onNewPasswordChange()" />
          <button type="button" class="eye-btn" (click)="togglePasswordVisibility('new')">
            <i class="fa" [ngClass]="showNewPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
          </button>
        </div>
        <div *ngIf="passwordErrors.length > 0" class="password-errors">
          <!-- <div *ngFor="let error of passwordErrors" class="error-text">{{ error }}</div> -->
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="form-group password-group">
        <label class="form-label">Confirm New Password:</label>
        <div class="input-wrapper">
          <input 
            [type]="showConfirmPassword ? 'text' : 'password'" 
            formControlName="confirmPassword" 
            class="form-control" 
            (input)="onConfirmPasswordChange()" />
          <button type="button" class="eye-btn" (click)="togglePasswordVisibility('confirm')">
            <i class="fa" [ngClass]="showConfirmPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
          </button>
        </div>
        <div *ngIf="passwordMatchMessage" 
             [ngClass]="{'match-text': passwordMatchMessage==='Passwords match', 'error-text': passwordMatchMessage!=='Passwords match'}">
          {{ passwordMatchMessage }}
        </div>
      </div>

      <!-- Disclaimer -->
      <div style="text-align: left; margin-bottom: 10px;">
        <label>Disclaimer:</label>
        <small class="password-disclaimer">
          Password must be at least <strong>15 characters</strong>, include at least
          <strong>one uppercase letter</strong>, <strong>one number</strong>, and
          <strong>one special character</strong>.
        </small>
      </div>

      <!-- Server or Form Errors -->
      <div *ngIf="passwordError" class="error-text">
        {{ passwordError }}
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn btn-primary" [disabled]="resetPasswordForm.invalid">
        Reset Password
      </button>
    </form>

    <!-- Footer -->
    <footer class="footer">
      Powered by
      <span class="build">Build</span>
      <span class="int">INT</span>
    </footer>
  </div>
</div>

<!-- Popup Overlay -->
<div *ngIf="showPasswordPopup" class="popup-overlay">
  <div class="popup">
    <p>{{ passwordSuccess || passwordError }}</p>
    <button (click)="showPasswordPopup=false">Close</button>
  </div>
</div>
