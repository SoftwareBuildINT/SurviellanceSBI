<div class="changepassword-container">
  <!-- Left Side -->
  <div class="changepassword-left">
    <img src="assets/images/hitachi logo.png" alt="Hitachi Logo" class="welcome-image" />
  </div>

  <!-- Right Side -->
  <div class="changepassword-right">
    <div class="logo-container">
      <img src="assets/images/sbi.png" alt="SBI Logo" class="sbi-logo" />
    </div>

    <!-- Change Password Form -->
    <form (ngSubmit)="onSubmit()" [formGroup]="changePasswordForm" class="changepassword-form">

      <!-- Old Password -->
      <div class="form-group password-group">
        <label class="form-label">Old Password:</label>
        <div class="input-wrapper">
          <input [type]="showOldPassword ? 'text' : 'password'" formControlName="oldPassword" class="form-control" />
          <button type="button" class="eye-btn" (click)="showOldPassword = !showOldPassword">
            <i class="fa" [ngClass]="showOldPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
          </button>
        </div>
        <div
          *ngIf="changePasswordForm.controls['oldPassword'].touched && changePasswordForm.controls['oldPassword'].errors?.['required']">
          Old password is required
        </div>
      </div>

      <!-- New Password -->
      <div class="form-group password-group">
        <label class="form-label">New Password:</label>
        <div class="input-wrapper">
          <input [type]="showNewPassword ? 'text' : 'password'" formControlName="newPassword" class="form-control" />
          <button type="button" class="eye-btn" (click)="showNewPassword = !showNewPassword">
            <i class="fa" [ngClass]="showNewPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
          </button>
        </div>
        <div
          *ngIf="changePasswordForm.controls['newPassword'].touched && changePasswordForm.controls['newPassword'].errors?.['required']">
          New password is required
        </div>
        <!-- <div *ngIf="changePasswordForm.controls['newPassword'].touched && changePasswordForm.controls['newPassword'].errors?.['pattern']">
          New password must be 8–16 characters, contain at least one uppercase letter, one number, and one special character
        </div> -->
      </div>

      <!-- Confirm Password -->
      <div class="form-group password-group">
        <label class="form-label">Confirm New Password:</label>
        <div class="input-wrapper">
          <input [type]="showConfirmPassword ? 'text' : 'password'" formControlName="confirmPassword"
            class="form-control" />
          <button type="button" class="eye-btn" (click)="showConfirmPassword = !showConfirmPassword">
            <i class="fa" [ngClass]="showConfirmPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
          </button>
        </div>
        <div
          *ngIf="changePasswordForm.controls['confirmPassword'].touched && changePasswordForm.controls['confirmPassword'].errors?.['required']">
          Confirm password is required
        </div>
        <div *ngIf="changePasswordForm.errors?.['mismatch']">
          Passwords do not match
        </div>
      </div>
      <div style="text-align: left">
        <label >Disclaimer:</label>
        <!-- Disclaimer -->
        <small class="password-disclaimer">
          Password must be at least <strong>15 characters</strong>, include at least
          <strong>one uppercase letter</strong>, <strong>one number</strong>, and
          <strong>one special character</strong>.
        </small>
      </div>
      <button type="submit" class="btn btn-primary" [disabled]="!changePasswordForm.valid">
        Change Password
      </button>

    </form>

    <!-- Footer -->
    <footer class="footer">
      Powered by
      <span class="build">Build</span>
      <span class="int">INT</span>
    </footer>
  </div>
</div>

<!-- Popup Overlay -->
<div *ngIf="showPopup" class="popup-overlay">
  <div class="popup">
    <p>{{ popupMessage }}</p>
    <button (click)="closePopup()">Close</button>
  </div>
</div>
