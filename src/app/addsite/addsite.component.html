<div class="container">
    <div class="header">
        <app-header [heading]="'Add Site Details'"></app-header>
    </div>

    <div class="main-container">
        <div class="side-nav">
            <app-sidebar></app-sidebar>
        </div>

        <div class="main">
            <div class="card-body">
                <!-- 🔹 Top Right Buttons -->
                <!-- <div class="top-buttons">
                    <button class="excel-btn download" (click)="downloadSampleExcel()">
                        📥 Download Sample Excel
                    </button>
                    <label class="excel-btn upload">
                        📤 Bulk Upload Excel
                        <input type="file" accept=".xlsx, .xls" hidden (change)="onFileUpload($event)" />
                    </label>
                </div> -->
                <form class="site-form" (ngSubmit)="onSubmit(siteForm)" #siteForm="ngForm">
                    <!-- ATM ID -->
                    <div class="row">
                        <!-- <div class="form-group">
                            <label for="atmId">ATM ID</label>
                            <input type="text" id="atmId" name="atmId" [(ngModel)]="site.atmId"
                                placeholder="Enter ATM ID" required />
                        </div> -->

                        <!-- LHO Dropdown -->
                        <div class="form-group">
                            <label for="lho">LHO Name</label>
                            <select id="lho" name="lhoId" [(ngModel)]="site.lhoId" required>
                                <option value="" disabled>Select LHO</option>
                                <option *ngFor="let l of lhoList" [value]="l.lho_id">
                                    {{ l.lho_name }}
                                </option>
                            </select>
                        </div>
                    </div>
                    <!-- ATM LATEST -->
                    <div class="row">
                        <div class="form-group">
                            <label for="atmLatest">ATM ID</label>
                            <input type="text" id="atmLatest" name="atmLatest" [(ngModel)]="site.atmLatest"
                                placeholder="Enter ATM Latest" required />
                        </div>
                    </div>

                    <!-- ATM 1–5 -->
                    <div class="row">
                        <div class="form-group">
                            <label>ATM 1</label>
                            <input type="text" [(ngModel)]="site.atm1" name="atm1" />
                        </div>

                        <div class="form-group">
                            <label>ATM 2</label>
                            <input type="text" [(ngModel)]="site.atm2" name="atm2" />
                        </div>
                    </div>

                    <div class="row">
                        <div class="form-group">
                            <label>ATM 3</label>
                            <input type="text" [(ngModel)]="site.atm3" name="atm3" />
                        </div>

                        <div class="form-group">
                            <label>ATM 4</label>
                            <input type="text" [(ngModel)]="site.atm4" name="atm4" />
                        </div>
                    </div>

                    <div class="row">
                        <div class="form-group">
                            <label>ATM 5</label>
                            <input type="text" [(ngModel)]="site.atm5" name="atm5" />
                        </div>
                    </div>

                    <!-- Status & Vendor -->
                    <div class="row">
                        <div class="form-group">
                            <label for="status">Status</label>
                            <select id="status" name="isActive" [(ngModel)]="site.isActive" required>
                                <option value="" disabled>Select Status</option>
                                <option value="1">Active</option>
                                <option value="0">Inactive</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="vendor">Vendor</label>
                            <select id="vendor" name="vendorId" [(ngModel)]="site.vendorId" required>
                                <option value="" disabled>Select Vendor</option>
                                <option *ngFor="let v of vendorList" [value]="v.vendor_id">
                                    {{ v.vendor_name }}
                                </option>
                            </select>
                        </div>
                    </div>

                    <!-- Address -->
                    <div class="row">
                        <div class="form-group full-width">
                            <label for="address">Site Address</label>
                            <input type="text" id="address" name="address" [(ngModel)]="site.address"
                                placeholder="Enter Site Address" required />
                        </div>
                    </div>

                    <!-- City, State, Pincode -->
                    <div class="row">
                        <div class="form-group">
                            <label for="city">City</label>
                            <input type="text" id="city" name="city" [(ngModel)]="site.city" placeholder="Enter City"
                                required />
                        </div>

                        <div class="form-group">
                            <label for="state">State</label>
                            <input type="text" id="state" name="state" [(ngModel)]="site.state"
                                placeholder="Enter State" required />
                        </div>

                        <div class="form-group">
                            <label for="pincode">Pincode</label>
                            <input type="text" id="pincode" name="pincode" [(ngModel)]="site.pincode"
                                placeholder="Enter Pincode" required maxlength="6"
                                (keypress)="validatePincode($event)" />
                        </div>
                    </div>

                    <button type="submit" class="submit-btn">Add</button>
                </form>
            </div>
        </div>
    </div>

    <footer class="footer">
        Powered by <span class="build">Build</span><span class="int">INT</span>
    </footer>
</div>
