# Include inside every HTTPS server block serving the dashboard or its API.
# Also include it in any nested location that defines its own add_header
# directives, since Nginx otherwise stops inheriting server-level headers.
# HSTS is only effective when delivered over HTTPS.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
